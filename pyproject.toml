[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "staticnest-cli"
dynamic = ["version"]
description = "A custom Python static site generator for polished documentation websites."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pygments>=2.0"]
authors = [{name="Akash B"}]
maintainers = [
  {name = "Akash B", email = "akashbasa8@gmail.com"}
]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
homepage = "https://github.com/Dev-kitx/staticnest-cli"
source = "https://github.com/Dev-kitx/staticnest-cli"
download = "https://github.com/Dev-kitx/staticnest-cli/releases"
changelog = "https://github.com/Dev-kitx/staticnest-cli/blob/main/CHANGELOG.md"
releasenotes = "https://github.com/Dev-kitx/staticnest-cli/releases"
documentation = "https://github.com/Dev-kitx/staticnest-cli#readme"
issues = "https://github.com/Dev-kitx/staticnest-cli/issues"

[tool.setuptools_scm]
# Basic config https://setuptools-scm.readthedocs.io/en/latest/
version_scheme = "only-version"
local_scheme   = "no-local-version"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = [
    "tests"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "coverage", "mypy>=1.10", "types-setuptools"]

[project.scripts]
staticnest = "staticnest.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

title = "Static Docs"
tagline = "Python static docs with a Static Docs theme"
description = "A custom Python static website generator focused on stylish documentation sites."
base_url = "/"
content_dir = "content"
output_dir = "dist"
nav_file = "navigation.yml"

[brand]
name = "Static Docs"
accent = "#f46e00"

[links]
github = "https://github.com/"

[theme]
name = "static-docs"

[api_docs]
enabled = true
source = "src/demo_api"
output = "content/api"
package = "demo_api"
title = "API Reference"
